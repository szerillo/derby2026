name: Scrape NYRA Bets pool

on:
  schedule:
    # Every 5 minutes (GitHub's minimum reliable cron interval).
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scrape Derby probables
        run: node scripts/scrape_pool.js
        continue-on-error: true

      - name: Scrape Belmont Stakes probables
        run: node scripts/scrape_belmont_pool.js
        continue-on-error: true

      - name: Commit refreshed payouts
        run: |
          git config user.email "actions@users.noreply.github.com"
          git config user.name "nyra-pool-bot"
          changed=0
          for f in data/derby_pool_payouts.json data/belmont/belmont_pool_payouts.json; do
            if [ -f "$f" ] && ! git diff --quiet -- "$f"; then
              git add "$f"
              changed=1
            fi
          done
          if [ "$changed" -eq 0 ]; then
            echo "No diff in any pool file. Skipping."
            exit 0
          fi
          git commit -m "Auto-update pool payouts ($(date -u +%H:%M)Z)"
          git push
          echo "Pushed."
